name: Auto-merge

# Enables GitHub's native auto-merge on eligible agent PRs. GitHub then merges
# only when every required check is green (PR checks "checks" + CircleCI security).
#
# Off by default: set repository variable AUTOMERGE_ENABLED=true after the
# baseline period. Requires "Allow auto-merge" in repository settings.
#
# This workflow runs scripts from the BASE branch and reads the PR's file list
# via the API, so PR code is never executed here.

on:
  pull_request:
    types: [opened, labeled, synchronize, ready_for_review]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enable:
    if: >-
      vars.AUTOMERGE_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'agent-ok') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human') &&
      github.event.pull_request.user.login == format('{0}[bot]', vars.AGENT_APP_SLUG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Daily cap on auto-merged PRs
        id: cap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CAP: ${{ vars.AUTOMERGE_DAILY_CAP || '10' }}
        run: |
          merged=$(gh pr list --repo "$REPO" --label agent-ok --state merged \
            --search "merged:>=$(date -u +%F)" --json number --jq 'length')
          echo "auto-merged today: $merged, cap: $CAP"
          if [ "$merged" -ge "$CAP" ]; then
            echo "reached=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Independent guard check
        id: guard
        if: steps.cap.outputs.reached != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '[.[] | {path: .filename, previous_path: .previous_filename, additions: .additions, deletions: .deletions, status: .status}]' \
            | jq -s 'add' > "$RUNNER_TEMP/files.json"
          if node tools/factory/size-guard.mjs --mode small --files-json "$RUNNER_TEMP/files.json" > guard.txt 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            cat guard.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash

      - name: Hand over to a human (guard failed or cap reached)
        if: steps.cap.outputs.reached == 'true' || steps.guard.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label agent-ok --add-label needs-human
          gh pr comment "$PR" --repo "$REPO" \
            --body "Not eligible for auto-merge (daily cap reached or small-ticket guard failed). Needs human review."
